<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" width="600" height="150">
  <!-- Brain network visualization -->
  <g transform="translate(30, 75)">
    <!-- Network nodes -->
    <circle cx="20" cy="40" r="8" fill="#F9A826"/>
    <circle cx="40" cy="70" r="8" fill="#F9A826"/>
    <circle cx="50" cy="20" r="8" fill="#F05454"/>
    <circle cx="70" cy="50" r="8" fill="#F05454"/>
    <circle cx="90" cy="30" r="8" fill="#F05454"/>
    <circle cx="80" cy="10" r="8" fill="#F05454"/>
    <circle cx="100" cy="60" r="8" fill="#F05454"/>
    
    <!-- Network connections -->
    <line x1="20" y1="40" x2="50" y2="20" stroke="#F9A826" stroke-width="3"/>
    <line x1="40" y1="70" x2="70" y2="50" stroke="#F9A826" stroke-width="3"/>
    <line x1="50" y1="20" x2="80" y2="10" stroke="#F05454" stroke-width="3"/>
    <line x1="50" y1="20" x2="70" y2="50" stroke="#F05454" stroke-width="3"/>
    <line x1="70" y1="50" x2="90" y2="30" stroke="#F05454" stroke-width="3"/>
    <line x1="90" y1="30" x2="80" y2="10" stroke="#F05454" stroke-width="3"/>
    <line x1="70" y1="50" x2="100" y2="60" stroke="#F05454" stroke-width="3"/>
  </g>
  
  <!-- Head silhouette -->
  <path d="M130,20 C160,0 180,10 190,30 C200,50 190,80 180,100 C170,120 150,130 130,120 C110,110 100,90 110,70 C120,50 120,30 130,20Z" fill="#E91E63" opacity="0.8"/>
  
  <!-- IT CONNECT text -->
  <g transform="translate(220, 90)">
    <!-- IT text -->
    <text font-family="Arial, sans-serif" font-weight="bold" font-size="70" fill="#3F51B5">
      <tspan x="0" y="0">IT</tspan>
    </text>
    
    <!-- CONNECT text -->
    <text font-family="Arial, sans-serif" font-weight="bold" font-size="70" fill="#3F51B5">
      <tspan x="80" y="0">C</tspan>
    </text>
    <text font-family="Arial, sans-serif" font-weight="bold" font-size="70" fill="#E91E63">
      <tspan x="130" y="0">O</tspan>
    </text>
    <text font-family="Arial, sans-serif" font-weight="bold" font-size="70" fill="#3F51B5">
      <tspan x="190" y="0">NNECT</tspan>
    </text>
    
    <!-- Network pattern overlay on text -->
    <g opacity="0.2">
      <line x1="0" y1="-10" x2="350" y2="-10" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="5,5"/>
      <line x1="0" y1="0" x2="350" y2="0" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="5,5"/>
      <line x1="0" y1="10" x2="350" y2="10" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="5,5"/>
    </g>
  </g>
</svg>